<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>همسفره | همسفره برنامه ای برای همسفره ها</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--card);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      border: 1px solid #e2e8f0;
    }
    .icon {
      width: 120px;
      height: 120px;
      border-radius: 1.5rem;
      margin-bottom: 1.5rem;
      object-fit: cover;
      box-shadow: 0 8px 16px -4px rgba(79, 70, 229, 0.3);
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: var(--primary);
      color: white;
      padding: 0.875rem;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: var(--primary-dark);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="./icon-192.png" alt="همسفره" class="icon">
    <h1>همسفره</h1>
    <p>همسفره برنامه ای برای همسفره ها — مدیریت هوشمند یخچال، انبار و مخارج مشترک خانوار</p>
    <button class="btn" id="installBtn">نصب وب‌اپلیکیشن (PWA)</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('همسفره Service Worker ثبت شد:', reg.scope))
          .catch((err) => console.warn('خطا در ثبت Service Worker:', err));
      });
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    document.getElementById('installBtn').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt = null;
      } else {
        alert('برای نصب همسفره، در مرورگر خود گزینه Add to Home screen را انتخاب کنید.');
      }
    });
  </script>
</body>
</html>
